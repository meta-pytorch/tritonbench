name: linux-test-mi350
on:
  workflow_call:
    inputs:
      conda_env:
        required: True
        type: string
        description: |
          Conda environment to activate when testing Triton
      test_module:
        required: False
        type: string
        default: "test.test_gpu.main"
        description: |
          Python unittest module to run

jobs:
  linux-test-mi350:
    if: github.repository_owner == 'meta-pytorch'
    runs-on: [amd-mi350-runner]
    timeout-minutes: 240
    environment: docker-s3-upload
    env:
      WORKSPACE_DIR: "/workspace"
      UV_VENV_DIR: "/workspace/uv_venvs"
      SETUP_SCRIPT: "/workspace/setup_instance.sh"
      CONDA_ENV: ${{ inputs.conda_env }}
      TEST_MODULE: ${{ inputs.test_module }}
      DOCKER_IMAGE: "ghcr.io/meta-pytorch/tritonbench:rocm-latest"
    steps:
      - name: Checkout Tritonbench
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Pull docker image
        uses: pytorch/test-infra/.github/actions/pull-docker-image@main
        with:
          docker-image: ${{ env.DOCKER_IMAGE }}
      - name: Test Tritonbench
        run: |
          set -eux
          GPU_FLAG="--device /dev/kfd --device /dev/dri --security-opt seccomp=unconfined --group-add video"

          container_name=$(docker run \
            ${GPU_FLAG:-} \
            --env-file /etc/podinfo/gha-gpu-isolation-settings \
            -e CONDA_ENV \
            -e TEST_MODULE \
            -e TRITON_HIP_USE_ASYNC_COPY \
            --ipc=host \
            --tty \
            --detach \
            --shm-size=32g \
            --cap-add=SYS_PTRACE \
            -v "${GITHUB_WORKSPACE}:/tmp/workspace" \
            -w /tmp/workspace \
            "${DOCKER_IMAGE}"
          )

          docker exec -t -w /tmp/workspace "${container_name}" bash -c "
            set -eux
            bash ./.ci/tritonbench/test-gpu.sh
          "
