common_args: --launch benchmarks.nightly.run --output-dir .benchmarks/nightly/run-${timestamp}
fp16__addmm_fwd:
  args: --op addmm --only streamk_addmm,triton_addmm  --baseline aten_addmm --metrics
    latency,tflops,speedup
fp16__addmm_bwd:
  args: --op addmm --only streamk_addmm,triton_addmm --bwd  --baseline aten_addmm
    --metrics latency,tflops,speedup
_bf16xint16_gemm_fwd:
