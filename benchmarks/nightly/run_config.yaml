# Run config file for nightly benchmark
# First, collect all ops and backends with tags "triton"
# Measure latency, flops, and speedup metrics in the best effort
# Some operators might not support flops or speedup metrics
run_config:
  with_backwards: true
  tags:
    - triton
  metrics:
    - latency
    - flops
    - speedup
# disable some ops
disabled:
  # FB-Only kernel
  - fp8_fused_quant_gemm_rowwise_fwd
# override some ops
overrides:
  launch_latency_fwd:
    args: --op launch_latency --metrics walltime
  bf16_blackwell_attentions_fwd:
    args: --op blackwell_attentions --metrics latency,tflops
    device: b200
  bf16_blackwell_attentions_bwd:
    args: --op blackwell_attentions --metrics latency,tflops --bwd
    device: b200
  # triton_tutorial_flash_v2_opt does not work on Triton main branch
  bf16_flash_attention_fwd:
    args: --op flash_attention --baseline flash_v3 --metrics latency,tflops,speedup --only triton_tutorial_flash_v2,flash_v3
  # flash_attention triton_tutorial_flash_v2 impl only supports causal in backward
  bf16_flash_attention_bwd:
    args: --op flash_attention --baseline flash_v3 --metrics latency,tflops,speedup --bwd --only triton_tutorial_flash_v2,flash_v3 --causal
  bf16_flex_attention_fwd:
    args: --op flex_attention --metrics latency,tflops --only compiled
  bf16_flex_attention_bwd:
    args: --op flex_attention --metrics latency,tflops --only compiled
