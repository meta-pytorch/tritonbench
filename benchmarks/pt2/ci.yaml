fp16_softmax_fwd:
  args: --op softmax --only triton_softmax,torch_compile_softmax --baseline naive_softmax
    --metrics latency,speedup
fp16_softmax_bwd:
  args: --op softmax --only triton_softmax,torch_compile_softmax --bwd --baseline
    naive_softmax --metrics latency,speedup
compile_time_fp16_softmax_fwd:
  args: --op softmax --only triton_softmax,torch_compile_softmax --baseline naive_softmax
    --metrics latency,speedup --num-inputs 1
compile_time_fp16_softmax_bwd:
  args: --op softmax --only triton_softmax,torch_compile_softmax --bwd --baseline
    naive_softmax --metrics latency,speedup --num-inputs 1
