# Test skip list in tritonbench OSS CI
# Usage:
#  op: to skip an entire operator
#    extra_args: <extra args to pass to the test>
#    extra_bwd_args: <extra args to pass to the backward test>
#    devices: <list of devices> (options: "cuda", "hip", "xpu", "h100", "mi350", "b200", default: ["h100", "mi350"])
#    channels: <list of triton channels> (options: "triton-main", "meta-triton", default: ["triton-main", "meta-triton"])
# to override the default, specify devices and channels to limit combinations
# we rely on the code to determine specific backends to skip
#    disabled_devices: <list of devices to disable on>
#    disabled_channels: <list of triton channels to disable on>
#    backends: <comma-separated backends to skip via --skip> (requires disabled_devices
#              or disabled_channels; only the listed backends are skipped instead of
#              disabling the entire operator when the disabled_* condition matches)
#
# Override the skip list entirely by setting the env var TRITONBENCH_TEST_SKIP_FILE
# to a custom yaml file path (a RuntimeError is raised if the file does not exist).
# aoti_kernel requires --artifact arg; tested separately
aoti_kernel:

# cpu-op for testing
test_op:
# fb-only ops
fp8_fused_quant_gemm_rowwise:
flash_attention:
  extra_bwd_args: --causal
# Device specific tests
blackwell_attentions:
  devices:
    - b200
  # Default input-0 is N_CTX=128, which triggers an AutoWS compiler crash and a
  # cross-tile race on the persistent Blackwell FA path (single-trip inner
  # loop). Run seq>=256 in CI until that is fixed. See T279315890.
  extra_args: --seq-len 256
blackwell_attentions_mxfp8:
  devices:
    - b200
  # Inherits the parent op's input shapes (input-0 is N_CTX=128), which triggers
  # the same AutoWS compiler crash and cross-tile race on the persistent
  # Blackwell FA path (single-trip inner loop). Run seq>=256 in CI until that is
  # fixed. See T279315890.
  extra_args: --seq-len 256
hstu_cross_attention_bwd:
  devices:
    - b200
  # Blackwell reduce_dq backward op (autoWS / TLX 2-KV variants). The default
  # kv-len sweep (256/384/512/1024) is heavy for CI; pin a single shape.
  extra_args: --seq-len-kv 256
ragged_attention:
  # cuda covers all NVIDIA (keeps existing coverage); the literal b200 entry is
  # required for the b200-only CI filter. This exercises hstu_tlx plus the
  # default and manual-DP AutoWS self-attention backends on b200 (the DQ-reduce
  # variant is disabled in the operator -- its bwd aborts the Triton compiler).
  devices:
    - cuda
    - b200
nvfp4_gemm:
  devices:
    - b200
fp32_to_mx4:
  devices:
    - cuda
mx4_to_fp32:
  devices:
    - cuda
# ============ TODO: errors in CI ============
# TODO: flash_attention will segfault on hip
flash_attention:
  report: true
  disabled_devices:
    - hip
# TODO: embedding will segfault on hip
embedding:
  report: true
  disabled_devices:
    - hip
# TODO: times out on xpu (>10min). The torch_compile backend requests
# mode="max-autotune-no-cudagraphs" over a 128256x4096 lm_head, which does not
# converge in CI time on the Intel inductor backend.
fused_linear_cross_entropy:
  report: true
  disabled_devices:
    - xpu
# TODO: crashes the Intel Graphics Compiler on xpu ("IGC: Internal Compiler
# Error: Floating point exception"), which aborts the whole process. Reduced
# repro: an online-softmax loop whose alpha/p are guarded by
# `tl.where(m_i_new == float("-inf"), 0, tl.math.exp(...))`; dropping the
# `== -inf` guard compiles fine, so this is a backend compiler bug rather than
# something the kernel can work around.
template_attention:
  report: true
  disabled_devices:
    - xpu
# TODO: times out on xpu (>30min). The liger/torch_compile backends lower a
# fused JSD over a 128256-wide vocab, and the Intel inductor backend spends the
# whole budget in kernel compilation and autotuning.
fused_linear_jsd:
  report: true
  disabled_devices:
    - xpu
# TODO: times out on xpu (>30min), same root cause as fused_linear_jsd: the
# torch_compile backend recompiles the fused geglu for every input shape and
# does not converge in CI time on the Intel inductor backend.
geglu:
  report: true
  disabled_devices:
    - xpu
# TODO: times out on xpu (>30min) in CI. The op does run correctly standalone
# (~13min for a single input on an Arc B580), but every backend recompiles a
# large jagged attention kernel from scratch, which is too slow to keep in the
# per-operator CI budget.
gdpa:
  report: true
  disabled_devices:
    - xpu
